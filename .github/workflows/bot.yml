name: Real Madrid news filter
on:
  schedule:
    - cron: "*/5 * * * *"   # backup - cron-job.org triggers every 3 min
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rm-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SOURCE_CHANNELS: ${{ vars.SOURCE_CHANNELS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save state
        run: |
          git config user.name "rm-bot"
          git config user.email "rm-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
