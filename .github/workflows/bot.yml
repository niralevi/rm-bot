name: Real Madrid news filter
on:
  schedule:
    - cron: "*/5 * * * *"   # backup - cron-job.org triggers every 3 min
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rm-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Always start from the NEWEST state.json (not the one from when the run was queued),
      # otherwise a run can re-post what the previous run already posted.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SOURCE_CHANNELS: ${{ vars.SOURCE_CHANNELS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save state
        if: always()
        run: |
          git config user.name "rm-bot"
          git config user.email "rm-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          # if something else was pushed meanwhile (e.g. you uploaded bot.py), merge and retry -
          # never lose the state, otherwise old posts get posted again
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || git rebase --abort
            sleep 3
          done
          echo "could not save state" && exit 1
